name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test, race
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the toolchain the project is developed and verified with.
          # Do not use 1.22 here: the macOS 15 (arm64) loader aborts Go <=1.22
          # test binaries at startup (dyld: missing LC_UUID load command).
          go-version: '1.27'
          check-latest: false

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          test -z "$(gofmt -l . )" || { echo 'gofmt needed on:'; gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...
